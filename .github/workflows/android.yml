name: Build Android APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Objetivo de compilación'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'apk_debug'
          - 'aab_release'

jobs:
  build-apk:
    name: Compilar APK Android (Debug)
    if: github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'apk_debug'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación web (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MODO_DEMO: 'false'
        run: npm run build

      - name: Sincronizar con Capacitor Android
        run: npx cap sync android

      - name: Compilar APK con Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Subir artefacto APK (kampuz.apk)
        uses: actions/upload-artifact@v4
        with:
          name: kampuz.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-aab:
    name: Compilar Android App Bundle (.aab) para Play Store
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'aab_release')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación web optimizada
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MODO_DEMO: 'false'
        run: npm run build

      - name: Sincronizar con Capacitor Android
        run: npx cap sync android

      - name: Decodificar Keystore de firma (Secrets)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Compilar Android App Bundle (.aab)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Subir artefacto AAB (kampuz-release.aab)
        uses: actions/upload-artifact@v4
        with:
          name: kampuz-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
